<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint 2 - Front-End | Web Development</title>
  <link rel="stylesheet" href="./src/css/styles2.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/b522bdfe69.js" crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <div class="hero">
      <div class="icons">
        <div class="row">
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-expand fa-lg"></i></div>
            <p>Alta Resolução</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-panorama fa-lg"></i></div>
            <p>Panorâmica</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-file-lines fa-lg"></i></div>
            <p>Documento<br>Ultra HD</p>
          </div>
        </div>

        <div class="row">
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-hourglass-half fa-lg"></i></div>
            <p>Câmera Lenta</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-stopwatch fa-lg"></i></div>
            <p>Intervalo</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-moon fa-lg"></i></div>
            <p>Superlua</p>
          </div>
        </div>
        
        <div class="row">
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-star fa-lg"></i></div>
            <p>Astro</p>
          </div>
          <div class="item">
            <div class="icon" style="font-weight: 500;">PRO</div>
            <p>Profissional</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-person-running fa-lg"></i></div>
            <p>Instantâneo</p>
          </div>
        </div>

        <div class="row">
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-utensils fa-lg"></i></div>
            <p>Comida</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-picture-in-picture fa-lg"></i></div>
            <p>Visualização Dupla</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-bullseye fa-lg"></i></div>
            <p>Feito em Movimento</p>
          </div>
        </div>
        
        <div class="row">
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-user fa-lg"></i></div>
            <p>Retrato</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-cloud-moon fa-lg"></i></div>
            <p>Noite</p>
          </div>
          <div class="item">
            <div class="icon"><i style="font-size: 20px;" class="fa-solid fa-film fa-lg"></i></div>
            <p>Microfilme</p>
          </div>
        </div>
      </div>

      <div class="modos">
        <a href="">Foto</a>
        <a style="color: var(--cor-amarela);" href="">Mais</a>
      </div>

      <h3 class="editar">Editar</h3>
      
    </div>
  </main>
</body>
</html>
